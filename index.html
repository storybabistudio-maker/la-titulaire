<body>
  <div id="sb-accueil">
    <div class="sb-fond"></div>
    <div class="sb-contenu">
      <img class="sb-logo" src="accueil-logo.webp" alt="Storybabi : La Titulaire">
      <div class="sb-bas">
        <p class="sb-accroche">Il te demande encore <b>« petit dépôt »…</b><br>Toi tu fais quoi ?</p>
        <div class="sb-barre"><div id="sb-jauge"></div></div>
        <div class="sb-ligne"><span id="sb-message">Pri finit sa dernière tête…</span><span id="sb-pct">0 %</span></div>
        <p class="sb-note">1re visite : le jeu se prépare. Ensuite, ça va plus vite.</p>
      </div>
    </div>
  </div>
  <script>
      // STORYBABI : la jauge suit le vrai téléchargement (renpy.data puis game.zip) et avance
      // aussi un tout petit peu toute seule, pour ne jamais paraître figée.
      (function () {
          var jauge = document.getElementById('sb-jauge'), pct = document.getElementById('sb-pct'),
              msg = document.getElementById('sb-message');
          var MSG = ["Pri finit sa dernière tête…", "Chantou prépare le gbaïrai…", "Maman Grâce compte la caisse…",
                     "Wil cherche encore son chargeur…", "Le woro-woro arrive…", "Presque prêt, ma sœur…"];
          var n = 0, cible = 2, plafond = 40, actuel = 0, fini = false;
          setInterval(function () { if (!fini && n < MSG.length - 2) msg.textContent = MSG[++n]; }, 3200);
          window.sbProgres = function (phase, fait, total) {
              if (!total) return;
              if (phase === 'data') { plafond = 44; cible = Math.max(cible, 4 + 40 * fait / total); }
              else { plafond = fait >= total ? 99 : 94; cible = Math.max(cible, 45 + 50 * fait / total); }
          };
          setInterval(function () {
              if (fini) return;
              if (actuel >= cible - 0.5 && cible < plafond) cible += 0.04;
              actuel += (cible - actuel) * 0.15;
              jauge.style.width = actuel.toFixed(1) + '%';
              pct.textContent = Math.floor(actuel) + ' %';
              if (actuel > 95) msg.textContent = MSG[MSG.length - 1];
          }, 100);
          window.sbPret = function () {
              if (fini) return;
              fini = true;
              jauge.style.width = '100%';
              pct.textContent = '100 %';
              var a = document.getElementById('sb-accueil');
              a.classList.add('sb-part');
              setTimeout(function () { a.remove(); }, 650);
              try { if (window.goatcounter && window.goatcounter.count)
                  window.goatcounter.count({ path: 'web/jeu-pret', title: 'Jeu chargé (fin de la page d\'accueil)', event: true }); } catch (e) {}
          };
      })();
  </script>

      </a>
      </span>

  <script>
      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip?v=202610270859';

      // Register the service worker.
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' });
          }
      }
  </script>
  <script>
      // STORYBABI : le son doit jouer même quand l'iPhone est en mode silencieux.
      (function () {
          try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
          var fait = false;
          function debloquer() {
              if (fait) return;
              fait = true;
              try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
              try {
                  var a = new Audio('silence.mp3');
                  a.setAttribute('playsinline', '');
                  a.play().catch(function () {});
              } catch (e) {}
              try { if (typeof context !== 'undefined' && context.resume) context.resume(); } catch (e) {}
          }
          ['touchend', 'click', 'keydown'].forEach(function (ev) {
              document.addEventListener(ev, debloquer, true);
          });
      })();
  </script>
  <script data-goatcounter="https://storybabi.goatcounter.com/count" async src="count.js"></script>
  <script src="renpy-pre.js"></script>
  <script>
      // STORYBABI : quand Ren'Py a fini de démarrer, on fond la page d'accueil HTML
      (function () {
          var origine = window.presplashEnd;
          window.presplashEnd = function () {
              try { if (origine) origine(); } catch (e) {}
              if (window.sbPret) window.sbPret();
          };
      })();
  </script>
